# Toolchain mirror — serves manifest.json + toolchain tarballs to the Volt IDE.
# Deploy as a Dokploy "Docker Compose" app; assign the domain in the dashboard
# (Dokploy injects the Traefik labels). Read-only static file server (nginx);
# the tarballs + signed manifest are pushed into the `mirror-data` volume
# out-of-band (rsync — see README.md), never over HTTP.
#
# Trust note: this origin serves bytes only. Integrity comes from the Ed25519
# signature on manifest.json (verified client-side against a pinned key) + the
# per-tarball SHA256. A compromised origin cannot forge a toolchain — it just
# fails verification. Keep the signing private key OFF this box.
services:
  toolchain-mirror:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - mirror-data:/srv/toolchains # tarballs + manifest.json, filled via rsync
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  toolchain-files:
    image: filebrowser/filebrowser:v2.32.0
    restart: unless-stopped
    command: ["--root", "/srv/toolchains", "--address", "0.0.0.0", "--port", "8080", "--database", "/database/filebrowser.db"]
    volumes:
      - mirror-data:/srv/toolchains
      - filebrowser-data:/database
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mirror-data:
  filebrowser-data:

networks:
  dokploy-network:
    external: true
