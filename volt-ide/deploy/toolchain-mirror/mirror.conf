# nginx server block for the Volt toolchain mirror.
# Installed at /etc/nginx/conf.d/default.conf. Traefik (Dokploy) terminates TLS
# and proxies plain HTTP here on the internal network, so we listen on :80.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /srv/toolchains;
    server_tokens off;          # don't leak the nginx version
    autoindex off;              # never list the directory
    charset utf-8;

    # Read-only mirror: uploads happen via rsync into the volume, not HTTP.
    # Reject anything that isn't a plain read.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Health probe for the compose healthcheck / Dokploy.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Read-only browser for humans. This intentionally lists the same public
    # mirror files the CLI can already download; it does not enable upload.
    location = /browse {
        return 301 /browse/;
    }
    location /browse/ {
        alias /srv/toolchains/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # manifest.json — small, changes on every publish. Must NOT be cached long
    # by any edge (Cloudflare) or the client would miss new toolchain versions.
    # The IDE keeps its own 24h cache and always re-verifies the signature.
    location ~* /manifest\.json$ {
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Toolchain tarballs — content-addressed & immutable (a given filename's
    # bytes never change). Cache forever at the edge. Range requests stay on
    # (nginx default) so interrupted 280 MB downloads can resume.
    location ~* \.(tar\.xz|tar\.gz|tgz|zip)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        types { }               # skip mime lookup
        default_type application/octet-stream;
        try_files $uri =404;
    }

    # Everything else: plain static serve, 404 on miss.
    location / {
        try_files $uri =404;
    }
}
