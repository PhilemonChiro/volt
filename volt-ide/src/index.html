<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volt IDE</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- TOOLBAR -->
    <header id="toolbar">
        <div class="toolbar-left">
            <div class="toolbar-brand">
                <img class="brand-logo" src="assets/volt-logo.svg" alt="Volt" width="18" height="18">
                <span class="brand-name">Volt</span>
            </div>

            <div class="toolbar-divider"></div>

            <!-- Primary action -->
            <button class="toolbar-btn" id="runBtn" title="Build + Flash + Monitor (Ctrl+R)">
                <svg class="toolbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <span>Run</span>
            </button>

            <button class="toolbar-btn" id="monitorBtn" title="Monitor (Ctrl+M)">
                <svg class="toolbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                <span>Monitor</span>
            </button>

            <div class="toolbar-divider"></div>

            <button class="toolbar-btn toolbar-btn-subtle" id="checkBtn" title="Check for errors (Ctrl+B)">
                <svg class="toolbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                <span>Check</span>
            </button>
            <button class="toolbar-btn toolbar-btn-subtle" id="formatBtn" title="Format code (Ctrl+Shift+I)">
                <svg class="toolbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="21" y1="10" x2="7" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="7" y2="18"/></svg>
                <span>Format</span>
            </button>
            <button class="toolbar-btn toolbar-btn-subtle" id="saveBtn" title="Save (Ctrl+S)">
                <svg class="toolbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                <span>Save</span>
            </button>
        </div>

        <div class="toolbar-right">
            <!-- Device selector -->
            <div class="device-selector-wrap">
                <button class="device-selector" id="deviceSelector">
                    <span class="device-dot" id="deviceDot"></span>
                    <span class="device-label" id="deviceLabel">No device</span>
                    <svg class="toolbar-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="device-dropdown" id="deviceDropdown">
                    <div class="dropdown-empty" id="dropdownEmpty">No devices detected</div>
                    <div id="dropdownList"></div>
                </div>
            </div>

            <div class="toolbar-divider"></div>

            <button class="toolbar-btn toolbar-btn-subtle" id="newProjectBtn" title="New Project (Ctrl+N)">
                <svg class="toolbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                <span>New</span>
            </button>
            <button class="toolbar-btn toolbar-btn-subtle" id="openProjectBtn" title="Open Project (Ctrl+O)">
                <svg class="toolbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                <span>Open</span>
            </button>
            <button class="toolbar-btn toolbar-btn-subtle" id="settingsBtn" title="Settings">
                <svg class="toolbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span>Settings</span>
            </button>

            <div class="toolbar-divider"></div>

            <!-- Window controls -->
            <div class="window-controls">
                <button class="win-btn" id="winMinimize" title="Minimize">
                    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
                <button class="win-btn" id="winMaximize" title="Maximize">
                    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                </button>
                <button class="win-btn win-close" id="winClose" title="Close">
                    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- WELCOME SCREEN (shown when no file is open) -->
    <main id="welcomeScreen">
        <div class="welcome-content">
            <img src="assets/volt-logo.svg" class="welcome-logo" alt="Volt">
            <h1 class="welcome-title">Volt IDE</h1>
            <p class="welcome-sub">A typed, hardware-aware language for embedded systems</p>

            <div class="welcome-actions">
                <button class="welcome-btn welcome-btn-primary" id="welcomeNewBtn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    New Project
                </button>
                <button class="welcome-btn" id="welcomeOpenBtn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    Open Project
                </button>
            </div>

            <div class="welcome-recent" id="welcomeRecent"></div>

            <div class="welcome-hint">
                <span class="welcome-kbd">Ctrl+N</span> New Project
                <span class="welcome-sep"></span>
                <span class="welcome-kbd">Ctrl+O</span> Open Project
                <span class="welcome-sep"></span>
                <span class="welcome-kbd">Ctrl+R</span> Run
            </div>
        </div>
    </main>

    <!-- EDITOR (hidden until a file is opened) -->
    <main id="editorContainer" style="display:none"></main>

    <!-- BOTTOM PANEL: Serial Monitor -->
    <section id="bottomPanel">
        <div id="panelHeader">
            <div class="panel-tabs">
                <button class="panel-tab active" data-panel="output">
                    Output
                </button>
                <button class="panel-tab" data-panel="monitor">
                    <span class="panel-dot" id="monitorDot"></span>
                    Serial Monitor
                </button>
                <button class="panel-tab" data-panel="problems">
                    Problems
                    <span class="badge" id="problemCount" style="display:none">0</span>
                </button>
            </div>
            <div class="panel-actions">
                <button class="panel-action-btn" id="panelCopyBtn" title="Copy" data-for="output,monitor,problems">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    <span>Copy</span>
                </button>
                <button class="panel-action-btn" id="monitorClearBtn" title="Clear" data-for="output,monitor">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                    <span>Clear</span>
                </button>
                <button class="panel-action-btn" id="monitorTimestampBtn" title="Toggle timestamps" data-for="monitor">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span>Time</span>
                </button>
                <button class="panel-action-btn" id="monitorPauseBtn" title="Pause" data-for="monitor">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                    <span>Pause</span>
                </button>
            </div>
        </div>
        <div id="outputContent" class="panel-content active"></div>
        <div id="monitorOutput" class="panel-content"></div>
        <div id="problemsContent" class="panel-content"></div>
    </section>

    <!-- STATUS BAR -->
    <footer id="statusBar">
        <div class="status-left">
            <span class="status-item" id="statusChip">
                <span class="status-dot" id="statusDot"></span>
                No device
            </span>
            <span class="status-item status-dim" id="statusPort"></span>
        </div>
        <div class="status-center">
            <span class="status-item" id="statusBuild"></span>
        </div>
        <div class="status-right">
            <span class="status-item status-dim" id="statusSize"></span>
            <span class="status-item status-dim" id="statusLine">Ln 1, Col 1</span>
        </div>
    </footer>

    <!-- Project picker overlay -->
    <div class="overlay" id="projectPickerOverlay">
        <div class="picker">
            <div class="picker-header">
                <span class="picker-title">Open Project</span>
                <button class="panel-action-btn" id="pickerCloseBtn">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="picker-list" id="projectList">
                <div class="picker-empty">No projects yet. Click New to create one.</div>
            </div>
            <div class="picker-footer">
                <button class="picker-browse-btn" id="pickerBrowseBtn">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    Browse for .volt file...
                </button>
            </div>
        </div>
    </div>

    <!-- New Project Wizard (uses same picker style as Open Project) -->
    <div class="overlay" id="wizardOverlay" style="display:none">
        <div class="picker" style="width:420px">
            <div class="picker-header">
                <span class="picker-title" id="wizardTitle">New Project</span>
                <button class="panel-action-btn" id="wizardCloseBtn">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="picker-list" style="padding:12px">
                <!-- Step 1: Board -->
                <div id="wizardStep1">
                    <div style="color:var(--fg-dim);font-size:12px;margin-bottom:8px">Select your board</div>
                    <div id="wizardBoards" style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
                        <button class="wizard-card active" data-chip="esp32"><strong>ESP32</strong><small>WiFi + BLE</small></button>
                        <button class="wizard-card" data-chip="rp2040"><strong>RP2040 Pico</strong><small>Dual-core ARM</small></button>
                        <button class="wizard-card" data-chip="esp8266"><strong>ESP8266</strong><small>WiFi</small></button>
                        <button class="wizard-card" data-chip="stm32f103"><strong>STM32</strong><small>Cortex-M3</small></button>
                    </div>
                </div>
                <!-- Step 2: Template -->
                <div id="wizardStep2" style="display:none">
                    <div style="color:var(--fg-dim);font-size:12px;margin-bottom:8px">Choose a template</div>
                    <div id="wizardTemplates" style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
                        <button class="wizard-card active" data-template="blink"><strong>Blink</strong><small>LED toggle</small></button>
                        <button class="wizard-card" data-template="iot-sensor"><strong>IoT Sensor</strong><small>WiFi + MQTT</small></button>
                        <button class="wizard-card" data-template="door-lock"><strong>Door Lock</strong><small>State machine</small></button>
                        <button class="wizard-card" data-template="empty"><strong>Empty</strong><small>Blank</small></button>
                    </div>
                </div>
                <!-- Step 3: Name -->
                <div id="wizardStep3" style="display:none">
                    <div style="color:var(--fg-dim);font-size:12px;margin-bottom:8px">Project name</div>
                    <input type="text" id="wizardName" placeholder="my-project" style="width:100%;box-sizing:border-box;padding:8px 10px;background:var(--bg-hover);border:1px solid var(--border);border-radius:4px;color:var(--fg);font-size:13px;font-family:var(--mono)">
                </div>
            </div>
            <div class="picker-footer" style="display:flex;justify-content:space-between">
                <button class="picker-browse-btn" id="wizardBackBtn" style="display:none">Back</button>
                <div style="flex:1"></div>
                <button class="picker-browse-btn" id="wizardNextBtn" style="background:var(--volt);color:#fff;border-color:var(--volt)">Next</button>
            </div>
        </div>
    </div>

    <!-- Monaco AMD loader (proven on WebKitGTK) -->
    <script src="lib/monaco/vs/loader.js"></script>
    <script>
        require.config({ paths: { vs: 'lib/monaco/vs' } });
        require(['vs/editor/editor.main'], function () {
            // Monaco ready — load app logic
            var s = document.createElement('script');
            s.src = 'dist/app.js?' + Date.now();
            document.body.appendChild(s);
        });
    </script>
</body>
</html>
