<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Volt IDE</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #1e1e1e; }
        #editor { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="editor"></div>
    <script src="lib/monaco/vs/loader.js"></script>
    <script>
        require.config({ paths: { vs: 'lib/monaco/vs' } });
        require(['vs/editor/editor.main'], function () {
            monaco.editor.create(document.getElementById('editor'), {
                value: 'chip esp32\n\nhardware {\n    pin led: Output = 2\n}\n\ntask blink() {\n    every 500ms {\n        led.toggle()\n    }\n}\n\nmain {\n    run(blink)\n}\n',
                language: 'plaintext',
                theme: 'vs-dark',
                fontSize: 14,
                automaticLayout: true,
            });
        });
    </script>
</body>
</html>
