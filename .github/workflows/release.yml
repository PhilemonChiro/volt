name: Build IDE Releases

# Triggers:
#   - Push a tag like v0.1.0       → builds all three platforms + creates a GitHub Release
#   - Manual ("Run workflow" in Actions tab) → builds only what you ask for, attaches as artifacts
#
# Each platform job runs on its native runner so native modules (serialport)
# compile correctly and no cross-build wrangling is needed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to build"
        required: true
        default: "all"
        type: choice
        options: [all, linux, windows, macos]

jobs:
  # ---------------------------------------------------------------
  # Guard: tag must match volt-ide/package.json "version" exactly.
  # Prevents the v0.2.x / 2.0.0 drift we had before.
  # Runs on tag push only — manual workflow_dispatch skips this and the
  # platform jobs do not depend on it.
  version-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package.json
        working-directory: volt-ide
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG  tag=v$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

  # ---------------------------------------------------------------
  linux:
    if: ${{ github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        working-directory: volt-ide
        # npm install (not ci) — package-lock.json is gitignored in this repo
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: volt-ide
        # pack:linux runs stage:sdk + build:icons + bundle:python (linux-x64) + electron-builder
        run: npm run pack:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            volt-ide/dist/*.AppImage
            volt-ide/dist/*.deb

  # ---------------------------------------------------------------
  windows:
    if: ${{ github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        working-directory: volt-ide
        run: npm install --no-audit --no-fund
      - name: Stage SDK + icons
        working-directory: volt-ide
        # prepack wipes sdk/ and re-populates it from repo — must run BEFORE
        # bundle:python so it doesn't clobber the downloaded Python interpreter.
        run: npm run prepack
      - name: Bundle Python (win32-x64)
        working-directory: volt-ide
        run: npm run bundle:python
      - name: Build (native Windows — produces NSIS + portable)
        working-directory: volt-ide
        # Use full Windows targets here (NSIS) since Wine is not in the picture.
        run: npx electron-builder --win nsis portable --config.win.signAndEditExecutable=true
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            volt-ide/dist/*.exe

  # ---------------------------------------------------------------
  macos:
    if: ${{ github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    # macos-latest is Apple Silicon (arm64). The arm64 bundle gets lark
    # installed natively. We also bundle a darwin-x64 Python so the x64 .dmg
    # exists, but lark isn't installed into it from this runner (cross-arch
    # pip install of a pure-Python wheel works fine though — see step below).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        working-directory: volt-ide
        run: npm install --no-audit --no-fund
      - name: Stage SDK + icons
        working-directory: volt-ide
        # MUST run before bundle:python — prepack wipes sdk/ via stage-sdk.js
        run: npm run prepack
      - name: Bundle Python (arm64 + x64) + cross-install lark
        working-directory: volt-ide
        # arm64 = host, gets lark installed natively. lark is pure-Python so we
        # cross-install it into the x64 bundle's site-packages too using arm64's pip.
        run: |
          npm run bundle:python -- --platform=darwin-arm64
          npm run bundle:python -- --platform=darwin-x64
          ./sdk/python/darwin-arm64/bin/python3 -m pip install \
            --target sdk/python/darwin-x64/lib/python3.12/site-packages \
            --no-warn-script-location --no-cache-dir --upgrade --force-reinstall lark
      - name: Build (arm64 + x64 DMGs)
        working-directory: volt-ide
        run: npx electron-builder --mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            volt-ide/dist/*.dmg

  # ---------------------------------------------------------------
  # Attach all artifacts to a GitHub Release when a tag triggered the run.
  release:
    needs: [linux, windows, macos]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/*
            artifacts/windows/*
            artifacts/macos/*
          generate_release_notes: true
          draft: true
