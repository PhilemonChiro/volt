<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Strict CSP: everything is local ('self'); the renderer makes no network
       calls (all Grid traffic goes through the main process over IPC). -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';" />
  <title>Volt Registry Signer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="brand">⚡ Volt Registry Signer</div>
    <div class="conn">
      <span id="grid-url">—</span>
      <button id="refresh" title="Refresh pending queue">↻</button>
      <button id="settings-btn" title="Settings">⚙</button>
    </div>
  </header>

  <main>
    <aside id="queue">
      <div class="queue-head">PENDING <span id="pending-count">0</span></div>
      <ul id="pending-list"></ul>
      <div id="queue-empty" class="empty">Nothing pending.</div>
    </aside>

    <section id="detail">
      <div id="detail-empty" class="empty">Select a pending library to review.</div>
      <article id="detail-body" hidden>
        <h1 id="d-title"></h1>
        <div id="d-meta" class="meta"></div>
        <div class="label">driver.c</div>
        <pre id="d-driver" class="code"></pre>
        <div class="hash">signing hash: <code id="d-hash"></code></div>
        <div class="actions">
          <button id="reject-btn" class="danger">Reject</button>
          <button id="sign-btn" class="primary">Sign &amp; Publish</button>
        </div>
        <div id="result" class="result" hidden></div>
      </article>
    </section>
  </main>

  <!-- Settings modal -->
  <div id="settings" class="modal" hidden>
    <div class="modal-card">
      <h2>Settings</h2>
      <label>Grid URL<input id="s-grid" type="text" placeholder="https://grid.sigma.co.zw" /></label>
      <label>Admin secret<input id="s-secret" type="password" placeholder="(unchanged if left blank)" /></label>
      <label>Signing key file<input id="s-key" type="text" /></label>
      <div id="s-keystate" class="keystate"></div>
      <div class="actions">
        <button id="s-cancel">Cancel</button>
        <button id="s-save" class="primary">Save</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
